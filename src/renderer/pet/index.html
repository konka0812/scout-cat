<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <title>scout-cat-pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #bubble {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        width: 250px;
        background: #fffdf8;
        color: #3a2f28;
        border: 1px solid #e8ddcf;
        border-radius: 14px;
        padding: 10px 13px;
        font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        box-shadow: 0 8px 24px rgba(60, 40, 20, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease, transform 0.22s ease;
        cursor: pointer;
      }
      #bubble.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }
      #bubble .src {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #a08d7c;
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <div id="bubble"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
