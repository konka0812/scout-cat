name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      target:
        description: "打包目标: nsis / portable / all"
        required: false
        default: "nsis"
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Run offline tests
        run: |
          node test-pipeline.mjs
          node test-review-fixes.mjs
          node test-backpack-dedup.mjs

      - name: Package NSIS installer
        if: env.TARGET == 'nsis' || env.TARGET == 'all'
        run: npx electron-builder --win nsis --publish never

      - name: Package portable exe
        if: env.TARGET == 'portable' || env.TARGET == 'all'
        run: npx electron-builder --win portable --publish never

      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            Select-Object Name, @{Name='SizeMB';Expression={[math]::Round($_.Length/1MB,2)}}

      - name: Upload NSIS installer
        if: env.TARGET == 'nsis' || env.TARGET == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: scout-cat-nsis
          path: dist/scout-cat-*-win.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload portable exe
        if: env.TARGET == 'portable' || env.TARGET == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: scout-cat-portable
          path: dist/scout-cat-*-portable.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.TARGET == 'all'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/scout-cat-*-win.exe
            dist/scout-cat-*-portable.exe
