name: iOS Swift Build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  core:
    name: Swift 核心包
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift 版本
        run: swift --version
      - name: 编译核心包
        working-directory: ios
        run: swift build
      - name: 运行测试
        working-directory: ios
        run: swift test

  app:
    name: iOS App + Widget 编译
    # macos-15 自带 Xcode 16，能读 objectVersion 77（xcodegen 生成的格式）
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 查看 Xcode 版本
        run: xcodebuild -version
      - name: 安装 xcodegen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate
      - name: 编译 iOS App（模拟器）
        working-directory: ios
        run: |
          plutil -lint ScoutCat.xcodeproj/project.pbxproj
          head -30 ScoutCat.xcodeproj/project.pbxproj
          xcodebuild -list -project ScoutCat.xcodeproj 2>&1 | head -40
          xcodebuild -project ScoutCat.xcodeproj \
            -scheme ScoutCat \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build